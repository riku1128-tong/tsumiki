<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="雲の上に浮かぶ積み木の島々を機関車がめぐる three.js のジオラマ">
<title>そらの積み木鉄道</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
  :root {
    --ink: #3a2a20;
    --paper: #fff8ea;
    --paper-edge: #e6c793;
    --wood: #d9a86a;
    --blue: #3f86d6;
    --blue-d: #2a5f9e;
    --yellow: #f5c533;
    --yellow-d: #c79a17;
    --orange: #f08a2c;
    --orange-d: #b9621a;
    --navy: #2c4a86;
    --navy-d: #1b3160;
    --red: #df4a38;
    --red-d: #a8321f;
    --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { margin: 0; overflow: hidden; background: #bfe2fa; font-family: var(--font); color: var(--ink); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .card {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 16px;
    max-width: min(340px, calc(100vw - 32px));
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 14px;
    box-shadow: 0 5px 0 var(--ink);
    padding: 12px 16px 12px;
    display: grid;
    gap: 4px;
  }
  .card h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 0.04em; line-height: 1.2; text-wrap: balance; }
  .card p { margin: 0; font-size: 13px; line-height: 1.55; font-weight: 500; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; margin-top: 2px; }
  .status i { width: 10px; height: 10px; border-radius: 50%; background: #4fae5a; border: 2px solid var(--ink); display: inline-block; }
  .status.stop i { background: var(--yellow); }

  .bar {
    position: fixed;
    left: 16px; right: 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: 10px 14px;
    pointer-events: none;
  }
  .grp {
    pointer-events: auto;
    display: flex; align-items: center; gap: 6px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 14px;
    box-shadow: 0 4px 0 var(--ink);
    padding: 6px 8px 6px 10px;
  }
  .lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; opacity: 0.7; margin-right: 2px; }
  button {
    font: 800 14px/1 var(--font);
    color: #fff;
    border: 2px solid var(--ink);
    border-radius: 9px;
    padding: 9px 12px 8px;
    cursor: pointer;
    background: var(--c, var(--blue));
    box-shadow: 0 3px 0 var(--cd, var(--blue-d));
    transform: translateY(0);
    transition: transform .08s, box-shadow .08s, filter .15s;
    text-shadow: 0 1px 0 rgba(0,0,0,.25);
  }
  button:hover { filter: brightness(1.07); }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--cd, var(--blue-d)); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  button[aria-pressed="false"] { background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--paper-edge); text-shadow: none; }
  .t-day { --c: var(--yellow); --cd: var(--yellow-d); color: var(--ink); text-shadow: none; }
  .t-sunset { --c: var(--orange); --cd: var(--orange-d); }
  .t-night { --c: var(--navy); --cd: var(--navy-d); }
  #whistle { pointer-events: auto; --c: var(--red); --cd: var(--red-d); font-size: 15px; padding: 12px 16px 11px; border-width: 3px; box-shadow: 0 4px 0 var(--ink); }
  #whistle:active { box-shadow: 0 1px 0 var(--ink); }

  .hint {
    position: fixed; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 18px);
    font-size: 12px; font-weight: 800; color: var(--ink);
    background: rgba(255,248,234,.85); border: 2px solid var(--ink); border-radius: 999px; padding: 5px 12px;
  }
  .tag {
    position: fixed; left: 0; top: 0;
    font: 800 13px/1 var(--font);
    color: var(--ink);
    background: var(--paper);
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    padding: 6px 11px 5px;
    box-shadow: 0 3px 0 var(--ink);
    white-space: nowrap;
    cursor: pointer;
    will-change: transform;
    text-shadow: none;
  }
  .tag::after {
    content: ""; position: absolute; left: 50%; bottom: -9px; width: 10px; height: 10px;
    background: var(--paper); border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink);
    transform: translateX(-50%) rotate(45deg);
  }
  .tag:hover { background: #fff; }
  .v-fly { --c: var(--red); --cd: var(--red-d); }
  .keys { display: grid; grid-template-columns: auto auto; gap: 3px 8px; font-size: 12px; font-weight: 800; align-items: center; }
  .keys kbd {
    font: 800 11px/1 var(--font); background: #fff; border: 2px solid var(--ink); border-bottom-width: 3px;
    border-radius: 6px; padding: 3px 6px 2px; margin-right: 2px; display: inline-block;
  }
  .hint.panel { border-radius: 14px; padding: 9px 12px; }
  .touch { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); z-index: 2; touch-action: none; user-select: none; -webkit-user-select: none; }
  #joy { left: 20px; width: 124px; height: 124px; border-radius: 50%; background: rgba(255,248,234,.55); border: 3px solid var(--ink); }
  #joy i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: var(--red); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
  #lift { right: 20px; display: grid; gap: 12px; }
  #lift button { width: 64px; height: 56px; font-size: 13px; padding: 0; touch-action: none; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font: 800 18px var(--font); color: var(--ink); pointer-events: none; }

  @media (max-width: 640px) {
    .card h1 { font-size: 18px; }
    .card p { display: none; }
    .hint { display: none; }
    button { font-size: 13px; padding: 8px 9px 7px; }
    .grp { padding: 5px 6px 5px 8px; }
    .tag { font-size: 11px; padding: 5px 8px 4px; }
  }
</style>
</head>
<body>

<canvas id="c" aria-label="空に浮かぶ積み木の島々を機関車が走る3Dシーン"></canvas>
<div class="loading" id="loading">積み木をならべています…</div>

<header class="card">
  <h1>そらの積み木鉄道</h1>
  <p>雲の上にうかぶ4つの島を、積み木の機関車がぐるりとめぐります。島の名前をクリックすると近くまで飛んでいけます。「飛んでみる」で、竹とんぼの子を操作して空を自由に飛べます。</p>
  <div class="status" id="status"><i></i><span>そらのえき に停車中</span></div>
</header>
<div class="hint" id="hint-orbit">ドラッグで回転・ホイール／ピンチでズーム</div>
<div class="hint panel" id="hint-fly" hidden>
  <div class="keys">
    <span><kbd>W</kbd><kbd>S</kbd></span><span>前へ／うしろへ（押し続けると加速）</span>
    <span><kbd>A</kbd><kbd>D</kbd></span><span>向きを変える</span>
    <span><kbd>Space</kbd></span><span>上昇</span>
    <span><kbd>Shift</kbd></span><span>下降</span>
    <span><kbd>ドラッグ</kbd></span><span>まわりを見る・ホイールで距離</span>
    <span><kbd>Esc</kbd></span><span>飛ぶのをやめる</span>
  </div>
</div>
<div class="touch" id="joy" hidden aria-label="移動スティック"><i></i></div>
<div class="touch" id="lift" hidden>
  <button id="up" type="button">上昇</button>
  <button id="down" type="button">下降</button>
</div>

<nav class="bar" aria-label="操作">
  <div class="grp" role="group" aria-label="視点">
    <span class="lbl">視点</span>
    <button id="v-orbit" aria-pressed="true">ぐるっと見る</button>
    <button id="v-follow" aria-pressed="false">機関車を追う</button>
    <button id="v-fly" class="v-fly" aria-pressed="false">飛んでみる</button>
  </div>
  <div class="grp" role="group" aria-label="時間">
    <span class="lbl">時間</span>
    <button id="t-day" class="t-day" aria-pressed="true">昼</button>
    <button id="t-sunset" class="t-sunset" aria-pressed="false">夕焼け</button>
    <button id="t-night" class="t-night" aria-pressed="false">夜</button>
  </div>
  <button id="whistle">ポッポー！</button>
</nav>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const V3 = THREE.Vector3;
const TAU = Math.PI * 2;
const UP = new V3(0, 1, 0);

// ---------- seeded random ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(20260923);
const R = (a = 0, b = 1) => a + (b - a) * rng();
const pick = arr => arr[Math.floor(rng() * arr.length)];

// wait briefly for the rounded font so canvas signs use it
try { await Promise.race([document.fonts.load('800 64px "M PLUS Rounded 1c"'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const isSmall = Math.min(innerWidth, innerHeight) < 700 || matchMedia('(pointer: coarse)').matches;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, isSmall ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#cfe7fa', 170, 820);
const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 4000);

// ---------- palette ----------
const C = {
  grass: '#8cc864', soil: '#e3a95c', clay: '#c9744a', rust: '#a95f3a', sand: '#f3dfa6', stone: '#cfc6b6',
  water: '#48b3e8', red: '#df4a38', yellow: '#f5c533', blue: '#3f86d6', navy: '#2c4a86', green: '#4fae5a',
  white: '#fbf7ee', cream: '#f6e7c8', pink: '#f7a8c0', orange: '#f08a2c', purple: '#8e62c4', dark: '#3b3a4a', brown: '#7a4b2a'
};
const WALLS = ['#f6e7c8', '#fbd3c4', '#cfe6f5', '#fff2a8', '#d9f0c9', '#fbf7ee', '#f3d6f0'];
const ROOFS = [C.red, C.blue, C.green, C.orange, C.purple, '#e06a8c'];
const BLOCKS = [C.red, C.yellow, C.blue, C.green, C.orange, '#e9c48f'];

// ---------- textures ----------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function woodTexture() {
  const t = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#ebc893'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 70; i++) {
      g.strokeStyle = `rgba(160,100,50,${0.05 + rng() * 0.13})`; g.lineWidth = 1 + rng() * 3;
      g.beginPath(); const y = rng() * h; g.moveTo(0, y);
      for (let x = 0; x <= w; x += 16) g.lineTo(x, y + Math.sin(x * 0.025 + i) * 5 + (rng() - 0.5) * 2);
      g.stroke();
    }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const woodTexBig = woodTexture(); woodTexBig.repeat.set(0.07, 0.07);
const woodTexSmall = woodTexture();

// ---------- materials ----------
const matCache = new Map();
function M(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0, ...opts }));
  return matCache.get(key);
}
const woodBig = new THREE.MeshStandardMaterial({ map: woodTexBig, roughness: 0.7 });
const woodSmall = new THREE.MeshStandardMaterial({ map: woodTexSmall, roughness: 0.7 });
const winMat = new THREE.MeshStandardMaterial({ color: '#3d5f93', emissive: '#ffcf6b', emissiveIntensity: 0, roughness: 0.3 });
const lampMat = new THREE.MeshStandardMaterial({ color: '#fff6d6', emissive: '#ffd27a', emissiveIntensity: 0, roughness: 0.4 });
const waterMat = new THREE.MeshStandardMaterial({ color: C.water, roughness: 0.15, metalness: 0.05, emissive: '#1b6fa8', emissiveIntensity: 0.12 });

// ---------- geometry helpers ----------
const gCache = new Map();
const cached = (k, fn) => { if (!gCache.has(k)) gCache.set(k, fn()); return gCache.get(k); };
const q = v => Math.round(v * 10) / 10;
function rbox(w, h, d, r = 0.15) { w = q(w); h = q(h); d = q(d); return cached(`rb${w},${h},${d},${r}`, () => new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2, h / 2, d / 2) * 0.98)); }
function cyl(rt, rb, h, seg = 14) { return cached(`cy${rt},${rb},${h},${seg}`, () => new THREE.CylinderGeometry(rt, rb, h, seg)); }
function cone(r, h, seg = 8) { return cached(`co${r},${h},${seg}`, () => new THREE.ConeGeometry(r, h, seg)); }
function sphere(r, d = 1) { return cached(`sp${r},${d}`, () => new THREE.IcosahedronGeometry(r, d)); }
function prismGeo(w, h, d) {
  return cached(`pr${w},${h},${d}`, () => {
    const b = 0.07, s = new THREE.Shape();
    s.moveTo(-w / 2 + b, b * 0.5); s.lineTo(w / 2 - b, b * 0.5); s.lineTo(0, h - b * 1.4); s.closePath();
    const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.02, d - 2 * b), bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 1 });
    g.translate(0, 0, -(d - 2 * b) / 2); return g;
  });
}
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function beam(a, b, r, mat, parent) {
  const d = new V3().subVectors(b, a); const len = d.length();
  const m = mesh(cyl(r, r, len, 8), mat, 0, 0, 0, parent);
  m.position.copy(a).addScaledVector(d, 0.5); m.quaternion.setFromUnitVectors(UP, d.normalize()); return m;
}
function shapeFn(rad, seed) {
  const p1 = seed * 1.37, p2 = seed * 2.11, p3 = seed * 0.73;
  return th => rad * (1 + 0.07 * Math.sin(3 * th + p1) + 0.045 * Math.sin(5 * th + p2) + 0.025 * Math.sin(8 * th + p3));
}
function outline(rf, sc, inset, segs, path) {
  for (let i = 0; i < segs; i++) {
    const th = i / segs * TAU, r = rf(th) * sc + inset;
    const x = Math.cos(th) * r, z = Math.sin(th) * r;
    i === 0 ? path.moveTo(x, -z) : path.lineTo(x, -z);
  }
  path.closePath(); return path;
}
function extrudeFlat(shape, h, bevel) {
  const g = new THREE.ExtrudeGeometry(shape, { depth: Math.max(0.02, h - 2 * bevel), bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, curveSegments: 1 });
  g.rotateX(-Math.PI / 2); g.translate(0, bevel, 0); return g;
}
const slabGeo = (rf, sc, h, segs = 44, bevel = 0.4) => extrudeFlat(outline(rf, sc, -bevel, segs, new THREE.Shape()), h, bevel);
function ringGeo(rf, so, si, h, bevel = 0.12, segs = 40) {
  const s = outline(rf, so, -bevel, segs, new THREE.Shape());
  s.holes.push(outline(rf, si, bevel, segs, new THREE.Path()));
  return extrudeFlat(s, h, bevel);
}

// ---------- instanced collections (trees, flowers) ----------
const inst = { trunk: [], ball: [], pine: [], flower: [] };
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new V3(), _p = new V3();
function pushInst(list, x, y, z, sx, sy, sz, color, rotY = 0) {
  _q.setFromAxisAngle(UP, rotY);
  list.push({ m: new THREE.Matrix4().compose(_p.set(x, y, z), _q, _s.set(sx, sy, sz)), c: new THREE.Color(color) });
}
function addTree(x, y, z, type = 'round', s = 1) {
  const th = (type === 'pine' ? 1.1 : 1.5) * s;
  pushInst(inst.trunk, x, y + th / 2, z, s, th, s, '#8a5a33');
  if (type === 'pine') {
    const col = pick(['#3f8f55', '#4a9e5c', '#357a4a']);
    pushInst(inst.pine, x, y + th + 1.2 * s, z, 1.9 * s, 2.6 * s, 1.9 * s, col, R(0, TAU));
    pushInst(inst.pine, x, y + th + 2.8 * s, z, 1.35 * s, 2.0 * s, 1.35 * s, col, R(0, TAU));
  } else {
    const col = type === 'cherry' ? pick(['#f7a8c0', '#f4b9cf', '#f59ab6']) : type === 'autumn' ? pick(['#f08a2c', '#f5c533', '#e2703a']) : pick(['#6dbb4f', '#5aae4a', '#82c55a', '#4f9f45']);
    pushInst(inst.ball, x, y + th + 1.2 * s, z, 1.7 * s, 1.6 * s, 1.7 * s, col, R(0, TAU));
  }
}
function buildInstances() {
  const defs = [
    ['trunk', cyl(0.28, 0.34, 1, 7), new THREE.MeshStandardMaterial({ roughness: 0.8 })],
    ['ball', sphere(1, 1), new THREE.MeshStandardMaterial({ roughness: 0.7, flatShading: true })],
    ['pine', cone(1, 1, 7), new THREE.MeshStandardMaterial({ roughness: 0.7, flatShading: true })],
    ['flower', sphere(0.22, 0), new THREE.MeshStandardMaterial({ roughness: 0.5, flatShading: true })],
  ];
  for (const [key, geo, mat] of defs) {
    const list = inst[key]; if (!list.length) continue;
    const im = new THREE.InstancedMesh(geo, mat, list.length);
    list.forEach((it, i) => { im.setMatrixAt(i, it.m); im.setColorAt(i, it.c); });
    im.castShadow = key !== 'flower'; im.receiveShadow = true; scene.add(im);
  }
}

// ---------- islands ----------
const islands = [
  { key: 'A', name: 'えきまえ島', c: new V3(0, 0, 18), R: 31, top: 0, seed: 1 },
  { key: 'B', name: 'たき山島', c: new V3(72, 0, -30), R: 28, top: 14, seed: 2 },
  { key: 'C', name: 'はなぞの島', c: new V3(8, 0, -90), R: 25, top: 8, seed: 3 },
  { key: 'D', name: 'うみべ島', c: new V3(-68, 0, -28), R: 29, top: -4, seed: 4 },
];
islands.forEach(I => { I.rf = shapeFn(I.R, I.seed); });
function islandAt(x, z, margin = 0) {
  for (let i = 0; i < islands.length; i++) {
    const I = islands[i], dx = x - I.c.x, dz = z - I.c.z;
    if (Math.hypot(dx, dz) < I.rf(Math.atan2(dz, dx)) - margin) return i;
  }
  return -1;
}
function edgePoint(I, th, inset = 0) {
  const r = I.rf(th) - inset;
  return new V3(I.c.x + Math.cos(th) * r, I.top, I.c.z + Math.sin(th) * r);
}

function buildIsland(I) {
  const g = new THREE.Group(); g.position.set(I.c.x, 0, I.c.z); scene.add(g);
  const layers = [[1.0, 1.8, M(C.grass)], [0.975, 2.4, M(C.soil)], [0.86, 4, woodBig], [0.7, 4, M(C.clay)], [0.5, 4.5, woodBig], [0.3, 5, M(C.rust)]];
  let y = I.top; const info = [];
  layers.forEach(([sc, h, mat], li) => {
    const off = li >= 2 ? [R(-1, 1) * I.R * 0.04, R(-1, 1) * I.R * 0.04] : [0, 0];
    mesh(slabGeo(I.rf, sc, h, 44, Math.min(0.5, h * 0.2)), mat, off[0], y - h, off[1], g);
    info.push({ sc, bottom: y - h, off });
    y -= h * 0.94;
  });
  const tip = mesh(cone(I.R * 0.17, 11, 7), woodBig, 0, y - 5.2, 0, g); tip.rotation.x = Math.PI;
  // hanging block stalactites
  for (let k = 0; k < 11; k++) {
    const li = 1 + Math.floor(R(0, 3)); const L = info[li], Lb = info[li + 1];
    const th = R(0, TAU); const rmax = I.rf(th) * L.sc * 0.88, rmin = I.rf(th) * Lb.sc * 1.06;
    if (rmax <= rmin + 1.5) continue;
    const rr = R(rmin + 0.8, rmax - 0.6);
    const px = Math.cos(th) * rr + L.off[0], pz = Math.sin(th) * rr + L.off[1];
    let yy = L.bottom + 0.3, s = R(2.2, 3.2);

const COLOR_KEYS = ['top', 'hor', 'bot', 'fog', 'sun', 'hemS', 'hemG', 'cloud', 'water'];
const NUM_KEYS = ['sunI', 'hemI', 'win', 'star', 'cloudE', 'beam', 'head'];
function toState(p) { const s = {}; COLOR_KEYS.forEach(k => s[k] = new THREE.Color(p[k])); NUM_KEYS.forEach(k => s[k] = p[k]); s.sunPos = new V3(...p.sunPos); return s; }
const cur = toState(PRESETS.day); let target = toState(PRESETS.day);
function setTime(key) {
  target = toState(PRESETS[key]);
  for (const k of ['day', 'sunset', 'night']) btn('t-' + k).setAttribute('aria-pressed', k === key);
}
for (const k of ['day', 'sunset', 'night']) btn('t-' + k).onclick = () => setTime(k);
function applyTime(dt, instant = false) {
  const f = instant ? 1 : 1 - Math.exp(-dt * 2.2);
  COLOR_KEYS.forEach(k => cur[k].lerp(target[k], f)); NUM_KEYS.forEach(k => cur[k] += (target[k] - cur[k]) * f); cur.sunPos.lerp(target.sunPos, f);
  skyMat.uniforms.top.value.copy(cur.top); skyMat.uniforms.hor.value.copy(cur.hor); skyMat.uniforms.bot.value.copy(cur.bot);
  skyMat.uniforms.sunCol.value.copy(cur.sun); skyMat.uniforms.sunDir.value.copy(cur.sunPos).normalize();
  scene.fog.color.copy(cur.fog);
  sun.color.copy(cur.sun); sun.intensity = cur.sunI; sun.position.copy(sun.target.position).addScaledVector(_t.copy(cur.sunPos).normalize(), 300);
  hemi.color.copy(cur.hemS); hemi.groundColor.copy(cur.hemG); hemi.intensity = cur.hemI;
  winMat.emissiveIntensity = cur.win; lampMat.emissiveIntensity = cur.win * 1.1 + cur.head * 0.5;
  starMat.opacity = cur.star; cloudMat.color.copy(cur.cloud); cloudMat.emissiveIntensity = cur.cloudE;
  wfUniforms.uTint.value.copy(cur.water);
  if (beam1) beam1.mat.opacity = cur.beam * 0.22;
  loco.userData.spot.intensity = cur.head * 160;
}
applyTime(0, true);

// ---------- whistle ----------
let actx = null;
function whistle() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, out = actx.createGain();
    out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(0.16, t + 0.05); out.gain.setValueAtTime(0.16, t + 0.32);
    out.gain.linearRampToValueAtTime(0.0, t + 0.42); out.gain.linearRampToValueAtTime(0.15, t + 0.52); out.gain.setValueAtTime(0.15, t + 1.25);
    out.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.connect(out); out.connect(actx.destination);
    for (const fq of [466, 587, 698]) {
      const o = actx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(fq * 0.95, t); o.frequency.linearRampToValueAtTime(fq, t + 0.08);
      o.frequency.setValueAtTime(fq * 0.97, t + 0.42); o.frequency.linearRampToValueAtTime(fq, t + 0.5);
      const g = actx.createGain(); g.gain.value = 0.22; o.connect(g); g.connect(lp); o.start(t); o.stop(t + 1.9);
    }
  } catch (e) {}
  const p = loco.localToWorld(new V3(0, 3.4, 0.8));
  for (let i = 0; i < 7; i++) setTimeout(() => emitPuff(p.clone().add(new V3(R(-0.3, 0.3), 0, R(-0.3, 0.3))), 0.8), i * 90);
}
btn('whistle').onclick = whistle;

// ---------- status ----------
const statusEl = btn('status'); let lastStatus = '';
function setStatus(txt, stop) {
  if (txt === lastStatus) return; lastStatus = txt;
  statusEl.classList.toggle('stop', stop); statusEl.querySelector('span').textContent = txt;
}
function islandNameAt(s) { const p = trackPoint(s, _t); const i = islandAt(p.x, p.z, 0); return i >= 0 ? islands[i].name : null; }

// ---------- loop ----------
const clock = new THREE.Clock();
let puffTimer = 0;
const chimney = new V3(0, 4.5, 2.1);
document.getElementById('loading').remove();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  applyTime(dt);

  // train motion with station stop
  if (train.state === 'wait') {
    train.wait -= dt; train.v = 0;
    setStatus(`そらのえき に停車中`, true);
    if (train.wait <= 0) { train.state = 'run'; train.s = wrapS(stopS + 0.02); }
  } else {
    const d = wrapS(stopS - train.s);
    const vStop = Math.sqrt(2 * train.dec * Math.max(0, d - 0.02));
    const tgt = Math.min(train.vmax, vStop);
    train.v = train.v < tgt ? Math.min(tgt, train.v + train.acc * dt) : tgt;
    train.s = wrapS(train.s + train.v * dt);
    if (d < 0.08 && train.v < 0.35) { train.state = 'wait'; train.wait = 5; train.s = wrapS(stopS); }
    const here = islandNameAt(train.s);
    setStatus(here ? `${here} を走行中` : '空の橋をわたっています', false);
  }
  placeTrain();
  for (const w of wheels) w.rotation.x = -train.s / 0.5;
  puffTimer -= dt;
  if (puffTimer <= 0) {
    emitPuff(loco.localToWorld(_t.copy(chimney)), train.v > 0.5 ? 1 : 0.7);
    puffTimer = train.v > 0.5 ? Math.max(0.12, 0.55 - train.v * 0.04) : 0.7;
  }
  for (const p of puffs) {
    if (!p.m.visible) continue;
    p.life += dt; const k = p.life / p.max;
    if (k >= 1) { p.m.visible = false; continue; }
    p.m.position.addScaledVector(p.vel, dt); p.vel.y *= 0.985;
    const sc = (0.55 + k * 2.4) * p.big; p.m.scale.setScalar(sc); p.m.material.opacity = 0.85 * (1 - k) * Math.min(1, p.life * 6);
  }

  // scenery animation
  wfUniforms.uTime.value = t;
  for (const s of spinners) { if (s.jet) s.o.scale.set(1, 1 + Math.sin(t * 7) * 0.12, 1); else s.o.rotation.z += dt * s.speed; }
  if (ferris) { ferris.wheel.rotation.z += dt * 0.12; for (const g of ferris.gondolas) g.rotation.z = -ferris.wheel.rotation.z; }
  for (const f of foams) { f.m.position.y = f.base + Math.sin(t * 4 + f.ph) * 0.12; f.m.scale.setScalar(1 + Math.sin(t * 5 + f.ph) * 0.12); }
  for (const b of boats) {
    const a = b.ph + t * b.sp; b.g.position.set(b.cx + Math.cos(a) * b.r, b.y + Math.sin(t * 2 + b.ph) * 0.06, b.cz + Math.sin(a) * b.r);
    b.g.rotation.y = -a; b.g.rotation.z = Math.sin(t * 1.6 + b.ph) * 0.06;
  }
  if (beam1) beam1.g.rotation.y += dt * 0.8;
  for (const b of floatBalloons) {
    b.g.position.set(b.base.x + Math.sin(t * 0.7 + b.ph) * 0.25, b.base.y + Math.sin(t * 1.3 + b.ph) * 0.35, b.base.z);
    const pa = b.line.geometry.attributes.position; pa.setXYZ(1, b.g.position.x, b.g.position.y - 1.5, b.g.position.z); pa.needsUpdate = true;
  }
  for (const b of birds) {
    const a = t * 0.11 + b.off * TAU, r = 64 + b.dr;
    const px = 4 + Math.cos(a) * r, pz = -32 + Math.sin(a) * r, py = 30 + b.dy + Math.sin(t * 0.8 + b.ph);
    b.g.position.set(px, py, pz); b.g.lookAt(px - Math.sin(a), py, pz + Math.cos(a));
    const fl = Math.sin(t * 11 + b.ph) * 0.6; b.l.rotation.z = fl; b.r.rotation.z = -fl;
  }
  for (const h of hotBalloons) {
    const a = h.ph + t * h.sp; h.g.position.set(Math.cos(a) * h.rad, h.h + Math.sin(t * 0.4 + h.ph) * 2, -32 + Math.sin(a) * h.rad);
  }
  cloudSea.rotation.y += dt * 0.004; cloudMid.rotation.y -= dt * 0.006;
  const now = new Date(), mins = now.getMinutes() + now.getSeconds() / 60, hrs = (now.getHours() % 12) + mins / 60;
  for (const h of clockHands) h.pivot.rotation.z = -(h.key === 'm' ? mins / 60 : hrs / 12) * TAU;

  // character (also drives the camera while flying)
  updateHero(dt, t);

  // camera
  if (mode === 'fly') {
    // handled in updateHero
  } else if (mode === 'follow') {
    trackPoint(train.s + 3, _a); trackPoint(train.s - 3, _b);
    const fwd = _t.subVectors(_a, _b).normalize(); const side = new V3().crossVectors(fwd, UP).normalize();
    const want = loco.position.clone().addScaledVector(fwd, -15).addScaledVector(side, 5).add(new V3(0, 6.5, 0));
    const look = loco.position.clone().addScaledVector(fwd, 8).add(new V3(0, 1.5, 0));
    const f = 1 - Math.exp(-dt * 3);
    camera.position.lerp(want, f); lookCur.lerp(look, f); camera.lookAt(lookCur);
  } else {
    if (fly) {
      fly.t += dt; const k = Math.min(1, fly.t / fly.dur), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      controls.target.lerpVectors(fly.fromT, fly.toT, e); camera.position.lerpVectors(fly.fromP, fly.toP, e);
      if (k >= 1) fly = null;
    }
    controls.update(); lookCur.copy(controls.target);
  }
  sky.position.copy(camera.position); stars.position.copy(camera.position);

  // labels
  const w = innerWidth, h = innerHeight;
  for (const tg of tags) {
    _t.copy(tg.pos).project(camera);
    const vis = _t.z < 1 && Math.abs(_t.x) < 1.1 && Math.abs(_t.y) < 1.1 && mode === 'orbit';
    tg.el.hidden = !vis;
    if (vis) tg.el.style.transform = `translate(${(_t.x * 0.5 + 0.5) * w}px, ${(-_t.y * 0.5 + 0.5) * h}px) translate(-50%, calc(-100% - 8px))`;
  }
  renderer.render(scene, camera);
});
</script>
</body>
